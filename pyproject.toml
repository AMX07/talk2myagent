[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talk2myagent"
version = "0.1.0"
description = "Local phone conversations with Codex planning and a local dialogue model on macOS"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.12,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "numpy>=2,<3", "scipy>=1.15,<2",
  "sounddevice>=0.5,<1", "soundfile>=0.13,<1", "pydantic>=2.11,<3",
]

[project.optional-dependencies]
voice = ["kokoro-onnx>=0.4,<0.5", "mlx-whisper>=0.4,<0.5"]
local = ["mlx-lm>=0.25,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
t2ma = "talk2myagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/talk2myagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
